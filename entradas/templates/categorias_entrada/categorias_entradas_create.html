{% extends 'base.html' %}

{% block title %}
    BIT-APP - Nova Categoria de Entrada
{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="d-flex align-items-center gap-2 mb-4">
        <a href="{% url 'entradas:categorias-entradas-list' %}" class="btn btn-sm btn-outline-secondary">← Voltar</a>
        <h5 class="mb-0 fw-semibold">Nova Categoria de Entrada</h5>
    </div>

    <div class="card border rounded p-4">
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label for="name" class="form-label small fw-semibold">Nome</label>
                <input
                    type="text"
                    class="form-control form-control-sm"
                    id="name"
                    name="nome"
                    placeholder="Ex: Alimentação"
                    required
                >
            </div>

            <div class="d-flex gap-2 justify-content-end">
                <a href="{% url 'entradas:categorias-entradas-list' %}" class="btn btn-sm btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-sm btn-primary">Salvar categoria</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
