{% extends 'base.html' %}

{% block title %}
    BIT-APP - Editar Categoria
{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="d-flex align-items-center gap-2 mb-4">
        <a href="{% url 'entradas:categorias-entradas-list' %}" class="btn btn-sm btn-outline-secondary">← Voltar</a>
        <h5 class="mb-0 fw-semibold">Editar Categoria</h5>
    </div>

    <div class="card border rounded p-4">
        <form method="POST">
            {% csrf_token %}

            {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label small fw-semibold">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}

            <div class="d-flex gap-2 justify-content-end">
                <a href="{% url 'entradas:categorias-entradas-list' %}" class="btn btn-sm btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-sm btn-warning">Salvar alterações</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
