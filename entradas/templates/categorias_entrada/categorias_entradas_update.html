{% extends 'base.html' %}
{% block title %}
    BIT-APP - Editar Categoria
{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 600px; margin-left: 15%;">

    <div class="card border rounded p-4">
        <h5 class="fw-semibold text-center mb-4">Editar Categoria</h5>

        <form method="POST">
            {% csrf_token %}

            {% for field in form %}
            <div class="mb-3">
                <label for="{{ field.id_for_label }}" class="form-label small fw-semibold w-100 text-center">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}

            <div class="d-flex gap-2 justify-content-between mt-3">
                <a href="{% url 'entradas:categorias-entradas-list' %}" class="btn btn-sm btn-outline-secondary">← Voltar</a>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-sm btn-success">Confirmar alterações</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
