{% extends 'base.html' %}
{% block title %}
    BIT-APP - Categorias de Entradas
{% endblock %}

{% block content %}
<div class="container py-4">

    <!-- HEADER -->
    <div class="d-flex align-items-center gap-3 mb-4" style="margin-left: 29%;">
        <h4 class="mb-0 fw-semibold text-warning d-flex align-items-center gap-2">
            <i class="bi bi-bookmark-plus"></i>
            Categorias de Entradas
        </h4>

        <a href="{% url 'entradas:categorias-entradas-create' %}" 
           class="btn btn-warning fw-semibold rounded-pill px-4 py-2">
            <i class="bi bi-plus-lg"></i> Nova Categoria
        </a>
    </div>

    <!-- CENTRALIZAÇÃO + LARGURA CONTROLADA -->
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">

            <div class="bg-dark rounded-4 border border-secondary-subtle overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle mb-0">

                        <thead>
                            <tr class="text-center small text-secondary">
                                <th>Nome</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <tbody>
                            {% for cat in categorias_entradas %}
                            <tr class="text-center">
                                
                                <td>
                                    <span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill">
                                        {{ cat.nome }}
                                    </span>
                                </td>

                                <td>
                                    <div class="d-flex justify-content-center gap-2">
                                        <a href="{% url 'entradas:categorias-entradas-update' cat.pk %}" 
                                           class="btn btn-sm btn-outline-light rounded-circle">
                                            <i class="bi bi-pencil"></i>
                                        </a>

                                        <a href="{% url 'entradas:categorias-entradas-delete' cat.pk %}" 
                                           class="btn btn-sm btn-outline-danger rounded-circle">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </div>
                                </td>

                            </tr>

                            {% empty %}
                            <tr>
                                <td colspan="2" class="text-center text-secondary py-4">
                                    Nenhuma categoria cadastrada.
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>

                    </table>
                </div>
            </div>

        </div>
    </div>

</div>
{% endblock %}
