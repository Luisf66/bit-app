{% extends 'base.html' %}

{% block title %}
    BIT-APP - Editar Entrada
{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="d-flex align-items-center gap-2 mb-4">
        <a href="{% url 'entradas:entradas-list' %}" class="btn btn-sm btn-outline-secondary">← Voltar</a>
        <h5 class="mb-0 fw-semibold">Editar Entrada</h5>
    </div>

    <div class="card border rounded p-4">
        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="d-flex gap-2 justify-content-end">
                <a href="{% url 'entradas:entradas-list' %}" class="btn btn-sm btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-sm btn-warning">Salvar alterações</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
