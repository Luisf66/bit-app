# Limite de requisições (apenas POST no login)
map $request_method $login_key {
    default "";
    POST    $binary_remote_addr;
}

limit_req_zone $login_key zone=login:10m rate=5r/m;

upstream django {
    server bit-app:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;
    server_tokens off;

    # Páginas de erro servidas pelo próprio Nginx
    proxy_intercept_errors on;
    error_page 404 /errors/404.html;
    error_page 502 503 504 /errors/502.html;

    # Compressão
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location ^~ /errors/ {
        root /usr/share/nginx/html;
        internal;
    }

    location /static/ {
        alias /bit-app/staticfiles/;
        expires 7d;
        access_log off;
    }

    location = /usuarios/login/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
