{% extends 'base.html' %}
{% block title %}BIT-APP - Upload de Arquivo{% endblock %}
{% block content %}

<div class="py-4 ml-[20%] mt-[3%]" style="max-width: 600px;">
  <div class="border border-zinc-700 rounded-lg p-6">

    <h5 class="font-semibold text-center mb-6">Upload de Arquivo</h5>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-4">
        <label for="arquivo"
               class="block text-sm font-semibold text-center mb-1">
          Selecione o arquivo
        </label>
        <input
          type="file"
          accept=".csv"
          id="arquivo"
          name="arquivo"
          required
          class="w-full bg-zinc-800 border border-zinc-600 rounded px-3 py-1.5 text-sm text-white file:bg-zinc-700 file:text-white file:border-0 file:rounded file:px-3 file:py-1 file:text-xs file:mr-3 file:cursor-pointer hover:file:bg-zinc-600 transition-colors"
        >
        <p class="text-xs text-zinc-500 text-center mt-1">
          Somente arquivos .csv serão aceitos
        </p>
      </div>

      <div class="flex justify-between items-center mt-6">
        <a href="javascript:history.back()"
           class="text-sm text-zinc-400 hover:text-white transition-colors no-underline">
          ← Voltar
        </a>
        <button type="submit"
                class="text-sm bg-green-600 hover:bg-green-500 text-white px-4 py-1.5 rounded transition-colors flex items-center gap-1">
          <i class="bi bi-upload"></i> Enviar
        </button>
      </div>
    </form>

  </div>
</div>

{% endblock %}
