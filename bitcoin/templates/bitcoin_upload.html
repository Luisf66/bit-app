{% extends 'base.html' %}
{% block title %}
    BIT-APP - Upload de Arquivo
{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 600px; margin-left: 20%; margin-top: 3%;">

    <div class="card border rounded p-4">
        <h5 class="fw-semibold text-center mb-4">Upload de Arquivo</h5>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="arquivo" class="form-label small fw-semibold w-100 text-center">
                    Selecione o arquivo
                </label>
                <input
                    type="file"
                    accept=".csv"
                    class="form-control form-control-sm"
                    id="arquivo"
                    name="arquivo"
                    required
                >
                <div class="form-text text-center">Somente arquivos .csv serão aceitos</div>
            </div>

            <div class="d-flex gap-2 justify-content-between mt-3">
                <a href="javascript:history.back()" class="btn btn-sm btn-outline-secondary">← Voltar</a>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-sm btn-success">
                        <i class="bi bi-upload me-1"></i>Enviar
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
