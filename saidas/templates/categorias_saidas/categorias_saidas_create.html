{% extends 'base.html' %}
{% block title %}
    BIT-APP - Nova Categoria de Saída
{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 600px; margin-left: 15%;">

    <div class="card border rounded p-4">
        <h5 class="fw-semibold text-center mb-4">Nova Categoria de Saída</h5>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label for="nome" class="form-label small fw-semibold w-100 text-center">Nome</label>
                <input
                    type="text"
                    class="form-control form-control-sm"
                    id="nome"
                    name="nome"
                    placeholder="Ex: Alimentação"
                    required
                >
            </div>

            <div class="d-flex gap-2 justify-content-between mt-3">
                <a href="{% url 'saidas:categorias-saidas-list' %}" class="btn btn-sm btn-outline-secondary">← Voltar</a>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-sm btn-success">Salvar categoria</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
