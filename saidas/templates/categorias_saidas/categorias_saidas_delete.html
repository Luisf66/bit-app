{% extends 'base.html' %}
{% block title %}BIT-APP - Excluir Categoria{% endblock %}
{% block content %}

<div class="py-6 px-8">
  <div class="max-w-lg">
    <div class="mb-8">
      <p class="text-zinc-500 text-xs font-semibold uppercase tracking-widest mb-1">Tags</p>
      <h4 class="text-white text-xl font-semibold flex items-center gap-2 m-0">
        <i class="bi bi-trash text-red-500"></i> Excluir Categoria
      </h4>
    </div>
    <div class="bg-zinc-900 border border-zinc-700 rounded-xl p-6">

      <div class="bg-red-900/30 border border-red-700 rounded-lg px-4 py-3 mb-6">
        <p class="text-red-400 text-sm m-0">Essa ação não pode ser desfeita.</p>
      </div>

      <p class="text-zinc-400 text-sm mb-4">Você está prestes a excluir a seguinte categoria:</p>

      <p class="text-center mb-6">
        <span class="bg-green-700 text-white text-base px-3 py-1 rounded font-normal">
          {{ object.nome }}
        </span>
      </p>

      <form method="POST">
        {% csrf_token %}
        <div class="flex justify-between items-center pt-4 border-t border-zinc-800">
          <a href="{% url 'saidas:saidas-list' %}"
             class="text-sm text-zinc-400 hover:text-white transition-colors no-underline">
            ← Voltar
          </a>
          <button type="submit"
                  class="bg-red-700 hover:bg-red-600 text-white font-semibold text-sm px-6 py-2.5 rounded-lg transition-colors">
            Confirmar Exclusão
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
