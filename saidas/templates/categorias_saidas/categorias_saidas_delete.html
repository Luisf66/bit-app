{% extends 'base.html' %}
{% block title %}
    BIT-APP - Excluir Categoria
{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 700px; margin-left: 15%;">

    <div class="card border rounded p-4">
        <h5 class="fw-semibold text-center mb-4">Excluir Categoria</h5>

        <div class="alert alert-danger small mb-3 text-center">
            Essa ação não pode ser desfeita
        </div>

        <p class="mb-3 small text-muted text-center">Você está prestes a excluir a seguinte categoria:</p>

        <p class="text-center mb-4">
            <span class="badge text-bg-success fs-6 fw-normal">{{ object.nome }}</span>
        </p>

        <form method="POST">
            {% csrf_token %}
            <div class="d-flex gap-2 justify-content-between mt-3">
                <a href="{% url 'saidas:categorias-saidas-list' %}" class="btn btn-sm btn-outline-secondary">← Voltar</a>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-sm btn-danger">Confirmar exclusão</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
