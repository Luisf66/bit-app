{% extends 'base.html' %}
{% block title %}BIT-APP - Categorias de Saídas{% endblock %}
{% block content %}

<div class="py-4 px-6">

  <!-- Header -->
  <div class="flex items-center gap-4 mb-6 ml-[29%]">
    <h4 class="font-semibold text-amber-500 flex items-center gap-2 m-0">
      <i class="bi bi-bookmark-dash"></i> Categorias de Saídas
    </h4>
    <a href="{% url 'saidas:categorias-saidas-create' %}"
       class="bg-amber-500 hover:bg-amber-400 text-black font-semibold text-sm px-4 py-2 rounded-full no-underline transition-colors flex items-center gap-1">
      <i class="bi bi-plus-lg"></i> Nova Categoria
    </a>
  </div>

  <!-- Tabela centralizada -->
  <div class="flex justify-center">
    <div class="w-full max-w-lg">
      <div class="bg-zinc-900 rounded-2xl border border-zinc-700 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-center text-zinc-400 text-xs border-b border-zinc-700">
                <th class="py-3 px-4 font-medium">Nome</th>
                <th class="py-3 px-4 font-medium">Ações</th>
              </tr>
            </thead>
            <tbody>
              {% for cat in categorias_saidas %}
              <tr class="text-center border-b border-zinc-800 hover:bg-zinc-800 transition-colors">
                <td class="py-3 px-4">
                  <span class="bg-red-900/40 text-red-400 text-xs px-3 py-1 rounded-full">
                    {{ cat.nome }}
                  </span>
                </td>
                <td class="py-3 px-4">
                  <div class="flex justify-center gap-2">
                    <a href="{% url 'saidas:categorias-saidas-update' cat.pk %}"
                       class="border border-zinc-500 hover:border-white text-zinc-400 hover:text-white rounded-full w-7 h-7 flex items-center justify-center transition-colors no-underline">
                      <i class="bi bi-pencil" style="font-size: 11px;"></i>
                    </a>
                    <a href="{% url 'saidas:categorias-saidas-delete' cat.pk %}"
                       class="border border-red-700 hover:border-red-500 text-red-500 hover:text-red-400 rounded-full w-7 h-7 flex items-center justify-center transition-colors no-underline">
                      <i class="bi bi-trash" style="font-size: 11px;"></i>
                    </a>
                  </div>
                </td>
              </tr>
              {% empty %}
              <tr>
                <td colspan="2" class="text-center text-zinc-500 py-8">
                  Nenhuma categoria cadastrada.
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</div>

{% endblock %}
