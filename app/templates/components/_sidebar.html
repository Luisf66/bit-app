<div class="flex flex-nowrap">
  <div class="bg-black min-h-screen px-5 pt-5">

    <!-- botão mobile -->
    <button
      class="block sm:hidden mb-3 bg-zinc-800 text-white rounded px-3 py-2"
      onclick="document.getElementById('menuCollapse').classList.toggle('hidden')"
    >
      <i class="bi bi-list text-2xl"></i>
    </button>

    <div id="menuCollapse" class="hidden sm:block">

      <!-- Dashboard -->
      <ul class="flex flex-col gap-1">
        <li>
          <a href="{% url 'bitcoin:bitcoin-dashboard' %}"
             class="flex items-center gap-2 text-white py-2 no-underline hover:text-amber-500 transition-colors">
            <i class="bi bi-graph-up text-2xl"></i>
            <span>Dashboard</span>
          </a>
        </li>
      </ul>

      <hr class="border-zinc-700 my-3 w-full">

      <!-- Entradas -->
      <ul class="flex flex-col gap-1">
        <li>
          <a href="{% url 'entradas:entradas-list' %}"
             class="flex items-center gap-2 text-white py-2 no-underline hover:text-amber-500 transition-colors">
            <i class="bi bi-cash-coin text-2xl"></i>
            <span>Entradas</span>
          </a>
        </li>
        <li>
          <a href="{% url 'entradas:categorias-entradas-list' %}"
             class="flex items-center gap-2 text-white py-2 no-underline hover:text-amber-500 transition-colors">
            <i class="bi bi-bookmark-plus text-2xl"></i>
            <span>Categorias das Entradas</span>
          </a>
        </li>
      </ul>

      <hr class="border-zinc-700 my-3 w-full">

      <!-- Saídas -->
      <ul class="flex flex-col gap-1">
        <li>
          <a href="{% url 'saidas:saidas-list' %}"
             class="flex items-center gap-2 text-white py-2 no-underline hover:text-amber-500 transition-colors">
            <i class="bi bi-graph-down-arrow text-2xl"></i>
            <span>Saídas</span>
          </a>
        </li>
        <li>
          <a href="{% url 'saidas:categorias-saidas-list' %}"
             class="flex items-center gap-2 text-white py-2 no-underline hover:text-amber-500 transition-colors">
            <i class="bi bi-bookmark-dash text-2xl"></i>
            <span>Categorias das Saídas</span>
          </a>
        </li>
      </ul>

      <hr class="border-zinc-700 my-3 w-full">

      <!-- Bitcoin -->
      <ul class="flex flex-col gap-1">
        <li>
          <a href="{% url 'bitcoin:bitcoin-upload' %}"
             class="flex items-center gap-2 text-white py-2 no-underline hover:text-amber-500 transition-colors">
            <i class="bi bi-currency-bitcoin text-2xl"></i>
            <span>Upload de Dados</span>
          </a>
        </li>
        <li>
          <a href="{% url 'bitcoin:bitcoin-list' %}"
             class="flex items-center gap-2 text-white py-2 no-underline hover:text-amber-500 transition-colors">
            <i class="bi bi-currency-bitcoin text-2xl"></i>
            <span>Transações</span>
          </a>
        </li>
      </ul>

      <hr class="border-zinc-700 my-3 w-full">

    </div>
  </div>
