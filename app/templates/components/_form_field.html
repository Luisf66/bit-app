{% load form_filters %}

{% if field|widget_type == 'Select' %}
<select
  name="{{ field.html_name }}"
  id="{{ field.id_for_label }}"
  class="w-full bg-zinc-800 border border-zinc-600 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500 transition-colors"
>
  {% for value, label in field.field.choices %}
  <option value="{{ value }}" {% if field.value|stringformat:"s" == value|stringformat:"s" %}selected{% endif %}>
    {{ label }}
  </option>
  {% endfor %}
</select>
{% elif field.field.widget.input_type == 'textarea' %}
<textarea
  name="{{ field.html_name }}"
  id="{{ field.id_for_label }}"
  rows="3"
  class="w-full bg-zinc-800 border border-zinc-600 rounded-lg px-4 py-2.5 text-sm text-white placeholder:text-zinc-500 focus:outline-none focus:border-amber-500 transition-colors resize-none"
>{{ field.value|default:'' }}</textarea>
{% else %}
<input
  type="{{ field.field.widget.input_type }}"
  name="{{ field.html_name }}"
  id="{{ field.id_for_label }}"
  {% if field.value %}value="{{ field.value }}"{% endif %}
  class="w-full bg-zinc-800 border border-zinc-600 rounded-lg px-4 py-2.5 text-sm text-white placeholder:text-zinc-500 focus:outline-none focus:border-amber-500 transition-colors"
>
{% endif %}
