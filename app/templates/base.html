<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}</title>

  <!-- Tailwind v4 browser -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @import "tailwindcss";
    @variant dark (&:where(.dark, .dark *));
  </style>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.plot.ly/plotly-3.4.0.min.js"></script>
</head>


<body class="bg-black text-white">

  {% include 'components/_header.html' %}

  <div class="flex flex-nowrap">

    {% include 'components/_sidebar.html' %}

    <div class="flex-1 min-w-0">

      {% if messages %}
      <div class="px-4 pt-4 flex flex-col gap-2">
        {% for message in messages %}
        <div class="flex items-center justify-between px-4 py-3 rounded text-sm
          {% if message.tags == 'success' %}bg-green-900/40 border border-green-700 text-green-400
          {% elif message.tags == 'error' %}bg-red-900/40 border border-red-700 text-red-400
          {% elif message.tags == 'warning' %}bg-yellow-900/40 border border-yellow-700 text-yellow-400
          {% else %}bg-zinc-800 border border-zinc-600 text-zinc-300{% endif %}">
          <span>{{ message }}</span>
          <button onclick="this.parentElement.remove()"
                  class="ml-4 text-current opacity-60 hover:opacity-100 transition-opacity">
            <i class="bi bi-x-lg" style="font-size: 12px;"></i>
          </button>
        </div>
        {% endfor %}
      </div>
      {% endif %}

      <div class="py-3">
        <main>
          {% block content %}{% endblock %}
        </main>
      </div>

    </div>
  </div>

  {% include 'components/_footer.html' %}

</body>
</html>
