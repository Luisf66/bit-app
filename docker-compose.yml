services:
  bit-app:
    build: .
    restart: always
    expose:
      - "8000"
    depends_on:
      - bit-app_db
    env_file:
      - .env
    volumes:
      - static_volume:/bit-app/staticfiles

  bit-app_db:
    image: postgres:15
    restart: always
    volumes:
      - bit-app_postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bit-app

  nginx:
    image: nginx:stable-alpine
    restart: always
    ports:
      - "80:80"
    depends_on:
      - bit-app
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/errors:/usr/share/nginx/html/errors:ro
      - static_volume:/bit-app/staticfiles:ro

volumes:
  bit-app_postgres_data:
  static_volume:
